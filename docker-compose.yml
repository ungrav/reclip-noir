services:
  reclip:
    build: .
    container_name: reclip
    ports:
      - "8899:8899"
    volumes:
      - .:/app
      - /app/downloads
      - auth-data:/app/auth
      - browser-data:/browser-data
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8899
    depends_on:
      - browser

  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: reclip-browser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - CHROME_CLI=--proxy-pac-url=http://host.docker.internal:8899/proxy.pac --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1" --window-size=420,800 https://www.youtube.com
    volumes:
      - browser-data:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  auth-data:
  browser-data:
